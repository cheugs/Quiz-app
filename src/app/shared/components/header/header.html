<header class="header">
  <div class="header-left">
    <h1>Hello, {{ userName() }}!</h1>
    <p>Welcome to EQuizz Admin Dashboard</p>
  </div>

  <div class="header-right">
    <!-- Search Box -->
    <div class="search-box">
      <input 
        type="text" 
        placeholder="Search quizzes, students, courses..." 
        [(ngModel)]="searchQuery"
        (keyup.enter)="onSearch()"
      />
      <button class="search-btn" (click)="onSearch()">
        <svg class="search-icon" viewBox="0 0 24 24">
          <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </button>
    </div>

    <!-- Messages -->
    <button class="icon-btn message-btn" [class.has-unread]="unreadMessages() > 0">
      <svg class="message-icon" viewBox="0 0 24 24">
        <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
      </svg>
      <span *ngIf="unreadMessages() > 0" class="badge">{{ unreadMessages() }}</span>
    </button>

    <!-- Notifications -->
    <div class="notification-container">
      <button class="icon-btn notification-btn" (click)="toggleNotifications()" [class.has-unread]="unreadNotifications() > 0">
        <svg class="notification-icon" viewBox="0 0 24 24">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/>
        </svg>
        <span *ngIf="unreadNotifications() > 0" class="badge">{{ unreadNotifications() }}</span>
      </button>

      <!-- Notifications Dropdown -->
      <div class="notifications-dropdown" *ngIf="showNotifications()">
        <div class="dropdown-header">
          <h3>Notifications</h3>
          <button class="view-all" (click)="viewAllNotifications()">View All</button>
        </div>
        
        <div class="notifications-list">
          <div *ngFor="let notification of notifications()" 
               class="notification-item" 
               [class.unread]="!notification.read"
               (click)="markNotificationAsRead(notification.id)">
            <div class="notification-icon-wrapper">
              <div class="notification-dot" *ngIf="!notification.read"></div>
            </div>
            <div class="notification-content">
              <div class="notification-title">{{ notification.title }}</div>
              <div class="notification-message">{{ notification.message }}</div>
              <div class="notification-time">{{ notification.time }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- User Profile -->
    <div class="profile-container">
      <button class="user-btn" (click)="toggleProfileMenu()">
        {{ getInitials() }}
      </button>

      <!-- Profile Dropdown -->
      <div class="profile-dropdown" *ngIf="showProfileMenu()">
        <div class="profile-info">
          <div class="profile-avatar">
            {{ getInitials() }}
          </div>
          <div class="profile-details">
            <div class="profile-name">{{ userName() }}</div>
            <div class="profile-email">{{ currentUser()?.email }}</div>
            <div class="profile-role">{{ currentUser()?.role | titlecase }}</div>
          </div>
        </div>
        
        <div class="dropdown-menu">
          <a routerLink="/profile" class="dropdown-item">
            <svg class="dropdown-icon" viewBox="0 0 24 24">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            My Profile
          </a>
          <a routerLink="/settings" class="dropdown-item">
            <svg class="dropdown-icon" viewBox="0 0 24 24">
              <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
            Settings
          </a>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item logout-btn" (click)="logout()">
            <svg class="dropdown-icon" viewBox="0 0 24 24">
              <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5a2 2 0 00-2 2v4h2V5h14v14H5v-4H3v4a2 2 0 002 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
            </svg>
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
