<!-- src/app/app.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EQuizz Admin Dashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Critical CSS -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #e8e6e1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    .app-loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #e8e6e1;
      z-index: 9999;
    }
    
    .app-loading .logo {
      margin-bottom: 2rem;
    }
    
    .app-loading .logo-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #4a5f52 0%, #6b8e7f 100%);
      border-radius: 12px;
      position: relative;
      animation: pulse 2s infinite;
    }
    
    .app-loading .logo-icon::before,
    .app-loading .logo-icon::after {
      content: '';
      position: absolute;
      background: #e8e6e1;
      border-radius: 50%;
    }
    
    .app-loading .logo-icon::before {
      width: 12px;
      height: 12px;
      top: 15px;
      left: 15px;
    }
    
    .app-loading .logo-icon::after {
      width: 12px;
      height: 12px;
      bottom: 15px;
      right: 15px;
    }
    
    .app-loading .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(107, 142, 127, 0.3);
      border-top: 3px solid #6b8e7f;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    .app-loading .loading-text {
      margin-top: 1rem;
      color: #666;
      font-size: 14px;
      font-weight: 500;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    @media print {
      .app-loading {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- App Loading Screen -->
  <div class="app-loading" id="appLoading">
    <div class="logo">
      <div class="logo-icon"></div>
    </div>
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading EQuizz Admin Dashboard...</div>
  </div>

  <!-- Angular Application Root -->
  <app-root>
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; padding: 2rem;">
      <div style="text-align: center; max-width: 400px;">
        <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #4a5f52 0%, #6b8e7f 100%); border-radius: 12px; margin: 0 auto 1.5rem; position: relative;">
          <div style="position: absolute; width: 12px; height: 12px; background: #e8e6e1; border-radius: 50%; top: 15px; left: 15px;"></div>
          <div style="position: absolute; width: 12px; height: 12px; background: #e8e6e1; border-radius: 50%; bottom: 15px; right: 15px;"></div>
        </div>
        <h1 style="color: #2d2d2d; margin-bottom: 0.5rem; font-weight: 600;">EQuizz Admin Dashboard</h1>
        <p style="color: #666; margin-bottom: 1.5rem;">Loading your educational management platform...</p>
        <div style="width: 100%; height: 4px; background: rgba(107, 142, 127, 0.2); border-radius: 2px; overflow: hidden;">
          <div style="width: 40%; height: 100%; background: #6b8e7f; animation: progress 2s ease-in-out infinite;"></div>
        </div>
      </div>
    </div>
  </app-root>

  <!-- Loading script -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const appRoot = document.querySelector('app-root');
      const loadingScreen = document.getElementById('appLoading');
      
      // When Angular app is ready, hide loading screen
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.attributeName === 'ng-version' && appRoot.hasAttribute('ng-version')) {
            loadingScreen.style.opacity = '0';
            loadingScreen.style.transition = 'opacity 0.3s ease';
            
            setTimeout(function() {
              loadingScreen.style.display = 'none';
              observer.disconnect();
            }, 300);
          }
        });
      });
      
      observer.observe(appRoot, { attributes: true });
      
      // Fallback: Hide loading screen after 10 seconds
      setTimeout(function() {
        if (loadingScreen && loadingScreen.style.display !== 'none') {
          loadingScreen.style.opacity = '0';
          loadingScreen.style.transition = 'opacity 0.3s ease';
          setTimeout(function() {
            if (loadingScreen) {
              loadingScreen.style.display = 'none';
            }
          }, 300);
        }
      }, 10000);
    });
    
    // Error handling
    window.addEventListener('error', function(event) {
      const loadingScreen = document.getElementById('appLoading');
      if (loadingScreen) {
        loadingScreen.innerHTML = `
          <div style="text-align: center; padding: 2rem; max-width: 400px;">
            <div style="width: 60px; height: 60px; background: #ef4444; border-radius: 12px; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px;">!</div>
            <h2 style="color: #2d2d2d; margin-bottom: 0.5rem;">Loading Error</h2>
            <p style="color: #666; margin-bottom: 1.5rem;">Failed to load the application. Please check your connection and try again.</p>
            <button onclick="window.location.reload()" style="background: #6b8e7f; color: white; border: none; padding: 0.5rem 1.5rem; border-radius: 6px; cursor: pointer; font-weight: 500;">Reload Application</button>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
